    <path d="M0 347 Q25 332 50 347 T100 347 T150 347 T200 347 T250 347 T300 347 T350 347 T400 347 T450 347 T500 347 T550 347 T600 347 T650 347 T700 347 T750 347 T800 347 T850 347 T900 347 T950 347 T1000 347 T1050 347 T1100 347 T1150 347 T1200 347"/>
