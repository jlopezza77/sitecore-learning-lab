    <path d="M420 185 q-45 0 -65 25 M420 185 q45 -5 65 22 M420 185 q-30 -30 -60 -25 M420 185 q30 -32 62 -22 M420 185 q5 -30 -5 -42" stroke="#1f7a3a" stroke-width="8" fill="none" stroke-linecap="round"/>
